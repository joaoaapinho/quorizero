[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorizero"
version = "0.1.0"
description = "Quorizero"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest==8.4.1",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "isort==6.0.1",
    "ruff==0.12.3",
    "pre-commit==4.2.0",
]
# JAX stack (CPU wheels by default). On an NVIDIA GPU also install:
#   pip install "jax[cuda12]==0.10.2"
ml = [
    "jax==0.10.2",
    "flax==0.12.8",
    "optax==0.2.8",
    "orbax-checkpoint==0.11.36",
    "mctx==0.0.71",
    "wandb==0.28.2",
    "jax2onnx==0.17.1",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
]
# Deploying retraining to Modal (infra/modal_app.py, scripts/deploy_page.sh)
deploy = [
    "modal>=1,<2",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]